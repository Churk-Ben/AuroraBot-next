# 每个表是一份独立模型 profile；密钥仅填写环境变量名称。
# 取消以下示例的注释后，配置相应环境变量。
# [primary]
# adapter = "org.aurora.adapter:adapters/model/litellm/chat"
# provider = "deepseek"
# model = "deepseek-flash"
# credential = "DEEPSEEK_API_KEY"
# reasoning_effort = "high"
# [primary.thinking]
# type = "enabled"
# Anthropic 启用思考时还可填写 budget_tokens = 4096；未配置时沿用供应商默认。
# [primary.capabilities]
# streaming = true
# tool_calls = true
# file_input = true
# primary 默认视为多模态；仅文本部署可显式设置 file_input = false。
