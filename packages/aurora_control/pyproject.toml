[project]
name = "aurora-control"
version = "0.1.0"
description = "Aurora execution contracts and control components"
requires-python = ">=3.12"
dependencies = ["aurora-core>=0.1.0"]

[project.entry-points."aurora.plugins"]
"aurora_control" = "aurora_control:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_control"]
