# 默认 bot 的实例与运行参数。
instance_id = "main"
model_role = "reasoning"
max_iterations = 8
tool_timeout = 30.0
streaming = true
system_prompt = ""
tools = []

# 每轮观察已启用的 world，预算只限制临时视图，不裁剪历史或归档。
[context_view]
enabled = true
events = true
environment = true
notes = true
max_chars = 12000

# 显式启用实例隔离的笔记工具；笔记由宿主快照保存，不自动执行其中的计划。
[notes]
enabled = false

# 显式启用当前 world 的只读事件归档工具；预算覆盖单次返回值的完整 JSON。
[archive]
enabled = false
max_chars = 8000
