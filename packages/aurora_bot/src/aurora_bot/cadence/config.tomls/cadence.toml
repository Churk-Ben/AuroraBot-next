# 按稳定 source_id 精确选择来源；空列表不转发，修改后重启生效。
# 已有消费状态的来源选择变化会暂停，须先核对消费范围。
source_ids = []

# 显式添加 [decision] 才启用随机时钟与 choice 决策；省略时沿用原样转发。
# 决策模式可在 source_ids=[] 时观察环境和已启用的工作笔记。
# model_role 引用 aurora_adapter 的 model/bindings.toml，须绑定 choice 适配器。
# 首次切换模式使用独立数据目录；不自动转换已有消费快照。
# [decision]
# model_role = "cadence"
# min_seconds = 60.0
# max_seconds = 180.0
# cooldown_seconds = 600.0
# timeout_seconds = 15.0
# max_chars = 12000
