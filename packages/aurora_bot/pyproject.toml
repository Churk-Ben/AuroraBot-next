[project]
name = "aurora-bot"
version = "0.1.0"
description = "AuroraBot default composition and plugins"
requires-python = ">=3.12"
dependencies = [
    "aurora-core>=0.1.0",
    "aurora-model-adapter>=0.1.0",
]

[project.entry-points."aurorabot.plugins"]
"aurora_bot.control" = "aurora_bot.control:plugin"
"aurora_bot.model" = "aurora_bot.model:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_bot"]
