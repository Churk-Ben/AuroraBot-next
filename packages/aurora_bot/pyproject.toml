[project]
name = "aurora-bot"
version = "0.1.0"
description = "AuroraBot default composition and plugins"
requires-python = ">=3.12"
dependencies = [
    "aurora-agent>=0.1.0",
    "aurora-core>=0.1.0", "aurora-config>=0.1.0",
    "aurora-control>=0.1.0",
    "aurora-adapter[litellm,jev]>=0.1.0",
    "aurora-world[config]>=0.1.0",
]

[project.entry-points."aurora.plugins"]
"aurora_bot.assembly" = "aurora_bot.assembly:plugin"
"aurora_bot.cadence" = "aurora_bot.cadence:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_bot"]
