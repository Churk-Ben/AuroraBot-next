[project]
name = "aurora-api"
version = "0.1.0"
description = "AuroraBot HTTP and WebSocket transport"
requires-python = ">=3.12"
dependencies = ["aurora-core>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_api"]
