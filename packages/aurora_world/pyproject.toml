[project]
name = "aurora-world"
version = "0.1.0"
description = "AuroraBot world inputs and shared environment state"
requires-python = ">=3.12"
dependencies = ["aurora-core>=0.1.0"]

[project.entry-points."aurorabot.plugins"]
aurora_world = "aurora_world.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_world"]
