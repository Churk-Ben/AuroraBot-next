[project]
name = "aurora-logging"
version = "0.1.0"
description = "AuroraBot shared logging configuration"
requires-python = ">=3.12"
dependencies = ["rich>=14,<15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_logging"]
