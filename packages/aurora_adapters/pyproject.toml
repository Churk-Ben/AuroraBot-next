[project]
name = "aurora-adapters"
version = "0.1.0"
description = "Aurora external protocol adapters"
requires-python = ">=3.12"
dependencies = ["aurora-core>=0.1.0"]

[project.optional-dependencies]
mcp = ["aurora-config>=0.1.0", "mcp==2.3.0", "httpx2>=2.16,<3"]
mcp-world = ["aurora-adapters[mcp]>=0.1.0", "aurora-world[config]>=0.1.0"]
mcp-tools = ["aurora-adapters[mcp]>=0.1.0", "aurora-agent>=0.1.0"]

[project.entry-points."aurora.plugins"]
"aurora_adapters.mcp" = "aurora_adapters.mcp:plugin"
"aurora_adapters.mcp.world" = "aurora_adapters.mcp.world:plugin"
"aurora_adapters.mcp.tools" = "aurora_adapters.mcp.tools:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_adapters"]
