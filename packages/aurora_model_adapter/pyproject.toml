[project]
name = "aurora-model-adapter"
version = "0.1.0"
description = "AuroraBot model protocols and adapters"
requires-python = ">=3.12"
dependencies = [
    "aurora-core>=0.1.0", "aurora-config>=0.1.0",
    "litellm[mcp]>=1.106.6,<1.107",
]

[project.entry-points."aurora.plugins"]
aurora_model_adapter = "aurora_model_adapter.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_model_adapter"]
