[project]
name = "aurorabot-ai"
version = "0.1.0"
description = "AuroraBot unified installation package"
requires-python = ">=3.12"
dependencies = ["aurora-bot>=0.1.0", "aurora-cli>=0.1.0", "aurora-api>=0.1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["packages/*/src", "tests"]
exclude = ["**/__pycache__", "**/node_modules", ".venv", "build", "dist"]
extraPaths = [
    "packages/aurora_core/src",
    "packages/aurora_model_adapter/src",
    "packages/aurora_bot/src",
    "packages/aurora_cli/src",
    "packages/aurora_api/src",
]

[tool.uv.workspace]
members = [
    "packages/aurora_core",
    "packages/aurora_model_adapter",
    "packages/aurora_bot",
    "packages/aurora_cli",
    "packages/aurora_api",
]

[tool.uv.sources]
aurora-core = { workspace = true }
aurora-model-adapter = { workspace = true }
aurora-bot = { workspace = true }
aurora-cli = { workspace = true }
aurora-api = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"
