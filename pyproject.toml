[project]
name = "aurorabot-ai"
version = "0.1.0"
description = "AuroraBot unified installation package"
requires-python = ">=3.12"
dependencies = ["aurora-bot>=0.1.0", "aurora-cli>=0.1.0", "aurora-api>=0.1.0", "aurora-world>=0.1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.9",
    "tomli-w>=1.2,<2",
]

[tool.coverage.run]
source = ["aurora_core", "aurora_control", "aurora_cli", "aurora_bot", "aurora_api", "aurora_model_adapter", "aurora_logging", "aurora_world"]

[tool.coverage.report]
fail_under = 20
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["packages/*/src", "tests", "examples"]
exclude = ["**/__pycache__", "**/node_modules", ".venv", "build", "dist"]
extraPaths = [
    "packages/aurora_core/src",
    "packages/aurora_control/src",
    "packages/aurora_model_adapter/src",
    "packages/aurora_bot/src",
    "packages/aurora_cli/src",
    "packages/aurora_api/src",
    "packages/aurora_logging/src",
    "packages/aurora_world/src",
]

[tool.uv.workspace]
members = [
    "packages/aurora_core",
    "packages/aurora_control",
    "packages/aurora_model_adapter",
    "packages/aurora_bot",
    "packages/aurora_cli",
    "packages/aurora_api",
    "packages/aurora_logging",
    "packages/aurora_world",
]

[tool.uv.sources]
aurora-core = { workspace = true }
aurora-control = { workspace = true }
aurora-model-adapter = { workspace = true }
aurora-bot = { workspace = true }
aurora-cli = { workspace = true }
aurora-api = { workspace = true }
aurora-logging = { workspace = true }
aurora-world = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"
